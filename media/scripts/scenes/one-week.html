<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="lib.js"></script>
<style>
.head { left: 96px; top: 100px; }
.head h1 { font-size: 60px; }
.head .sub { margin-top: 10px; font-size: 26px; }
#grid { position: absolute; left: 0; top: 0; }
.dayh { font: 600 24px var(--sans); fill: var(--ink); }
.hr { font: 500 18px var(--sans); fill: var(--accent); }
.evl { font: 650 16px var(--sans); }
.evb { font: 400 14px var(--sans); }
.cap { position: absolute; left: 200px; top: 944px; font: 400 22px/1.3 var(--sans); color: var(--body); }
.cap b { color: var(--ink); font-weight: 600; }
.cap i { display: inline-block; width: 26px; height: 14px; vertical-align: -1px; margin: 0 8px 0 0; }
#map { position: absolute; left: 50px; top: 104px; transform: scale(.92); transform-origin: 0 0; background: #F2EEE7; border: 1px solid var(--line); }
.st-path { fill: none; stroke: #D8D1C6; stroke-width: 0.8; }
.st-minor { fill: none; stroke: #CFC7BB; stroke-width: 1.1; }
.st-major { fill: none; stroke: #B8B0A4; stroke-width: 2.2; }
.walk { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-dasharray: 1 7; stroke-linecap: round; }
.bus { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.pill rect { fill: var(--ink); }
.pill text { fill: var(--bg); font: 700 17px var(--sans); text-anchor: middle; }
.bl { font: 600 18px var(--sans); fill: var(--ink); paint-order: stroke; stroke: #F2EEE7; stroke-width: 6px; stroke-linejoin: round; }
.panel { position: absolute; left: 1140px; top: 104px; width: 720px; }
.ph { font: 600 20px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.home { font: 400 40px/1.1 var(--display); margin-top: 12px; }
.home small { display: block; font: 400 22px/1.3 var(--sans); color: var(--body); margin-top: 8px; }
.days { display: flex; gap: 0; margin-top: 26px; border-bottom: 1px solid var(--line); }
.days span { flex: 1; text-align: center; font: 600 24px/1 var(--sans); color: var(--line); padding: 10px 0 14px; border-bottom: 3px solid transparent; }
.days span.on { color: var(--ink); border-bottom-color: var(--ink); }
.days span.done { color: var(--accent); }
.trips { height: 312px; margin-top: 8px; }
.tr { display: grid; grid-template-columns: 76px 1fr 120px 96px; align-items: center; height: 52px; border-bottom: 1px solid rgba(184,176,164,.6); font: 400 21px/1.1 var(--sans); }
.tr .tm { color: var(--accent); font-weight: 500; }
.tr .od { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
.tr .md { font-weight: 600; font-size: 19px; }
.tr .mn { text-align: right; font-weight: 600; }
.ctr { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 1.5px solid var(--ink); }
.ctr > div { padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
.ctr .k { font: 500 18px/1 var(--sans); color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.ctr .v { font: 600 40px/1 var(--sans); margin-top: 10px; letter-spacing: -0.01em; }
.ctr .v small { font: 400 20px var(--sans); color: var(--accent); margin-left: 4px; }
.gen { margin-top: 18px; font: 400 23px/1.35 var(--sans); color: var(--body); }
.gen b { color: var(--ink); font-weight: 650; }
.key { position: absolute; left: 66px; top: 916px; display: flex; gap: 26px; font: 500 19px var(--sans); color: var(--body); background: rgba(242,238,231,.92); padding: 8px 12px; }
.end { position: absolute; left: 1140px; top: 340px; width: 720px; font: 400 30px/1.3 var(--display); }
.end b { font-family: var(--sans); font-weight: 650; }
</style></head><body>
<svg id="grid" width="1920" height="1080"></svg>
<script>
const D = window.DATA, P = D.params, M = D.map, TOT = D.totals;
window.DURATION = 55; window.POSTER_T = 50;
const DAYS = ['M', 'T', 'W', 'R', 'F'], DAYN = { M: 'Monday', T: 'Tuesday', W: 'Wednesday', R: 'Thursday', F: 'Friday' };
const SHORT = { eecs: 'EECS', bbb: 'Beyster', ggbl: 'GG Brown', lsa: 'LSA Bldg', duderstadt: 'Duderstadt', nccrb: 'NCRB gym' };
const byName = {}; D.events.forEach((e) => (byName[e.building] = SHORT[e.building_id] || e.building));
const nm = (s) => s === D.home.name || s.startsWith('l:') ? 'Home' : (byName[s] || s);
// ---------------- phase A: the weekly grid
const GX0 = 200, GX1 = 1824, GY0 = 290, GY1 = 920, TA = 480, TB = 1380;
const colW = (GX1 - GX0) / 5, ym = (m) => GY0 + (m - TA) / (TB - TA) * (GY1 - GY0);
let G, gEvents = [], gTrips = [], CAP, HEAD, HEAD2;
// ---------------- phase B: map + panel
let MAP, legEls = [], pills = [], PANEL, dayEls = {}, rowsBox, rowEls = [], ctr = {}, KEY, END, homeMark, bldG, headDot;
const SCHED = []; { let t = 16.2; let prev = null; D.trips.forEach((r, i) => { if (prev && r.day !== prev) t += 0.55; SCHED.push({ t0: t, t1: t + 0.95 }); t += 1.08; prev = r.day; }); }
const TEND = SCHED[SCHED.length - 1].t1;
window.setup = () => {
  HEAD = L.h('div', { class: 'abs head' }, document.body, `<h1>One week, <em>trip by trip</em></h1>
    <div class="sub">The North Campus engineer's schedule is the input. Every class and activity becomes a stop on a day tour.</div>`);
  G = document.getElementById('grid');
  DAYS.forEach((d, i) => L.h('text', { class: 'dayh', x: GX0 + colW * i + 12, y: GY0 - 18 }, G, DAYN[d]));
  for (let m = TA; m <= TB; m += 120) { L.h('line', { x1: GX0, x2: GX1, y1: ym(m), y2: ym(m), stroke: 'var(--line)', 'stroke-dasharray': '3 6' }, G); L.h('text', { class: 'hr', x: GX0 - 16, y: ym(m) + 6, 'text-anchor': 'end' }, G, L.hhmm(m)); }
  for (let i = 0; i <= 5; i++) L.h('line', { x1: GX0 + colW * i, x2: GX0 + colW * i, y1: GY0 - 6, y2: GY1, stroke: 'var(--line)' }, G);
  const order = [...D.events.filter((e) => e.source === 'student'), ...D.events.filter((e) => e.source !== 'student')];
  order.forEach((e, k) => {
    const g = L.h('g', {}, G); const stu = e.source === 'student';
    e.days.forEach((d) => {
      const x = GX0 + colW * DAYS.indexOf(d) + 6, y = ym(e.start), h = ym(e.end) - ym(e.start);
      L.h('rect', { x, y, width: colW - 12, height: h, rx: 3, fill: stu ? 'var(--ink)' : 'rgba(255,255,255,.55)', stroke: stu ? 'none' : 'var(--accent)', 'stroke-width': 1.5, 'stroke-dasharray': stu ? '' : '5 4' }, g);
      L.h('text', { class: 'evl', x: x + 10, y: y + 20, fill: stu ? 'var(--bg)' : 'var(--ink)' }, g, `${e.label}`);
      if (h > 40) L.h('text', { class: 'evb', x: x + 10, y: y + 38, fill: stu ? '#CFC7BB' : 'var(--body)' }, g, `${SHORT[e.building_id] || e.building} · ${L.hhmm(e.start)}–${L.hhmm(e.end)}`);
    });
    gEvents.push({ g, k, stu });
  });
  // trip markers on the grid: a tick at each trip's departure, in its day column
  D.trips.forEach((r, i) => { const x = GX0 + colW * DAYS.indexOf(r.day) + colW - 22, y = ym(r.depart); gTrips.push(L.h('circle', { cx: x, cy: y, r: 6, fill: r.mode === 'bus' ? 'var(--ink)' : 'none', stroke: 'var(--ink)', 'stroke-width': 2 }, G)); });
  const nStu = D.events.filter((e) => e.source === 'student').length;
  CAP = L.h('div', { class: 'cap' }, document.body, `<b>${nStu}</b> events typed by the student · <b>${D.events.length - nStu}</b> more from the program template “${D.template.name}” (dashed) · <span id="ctrips"></span>`);
  // ---------- map
  MAP = L.h('svg', { id: 'map', width: M.W, height: M.H }, document.body);
  for (const k of ['path', 'minor', 'major']) L.h('path', { class: 'st-' + k, d: M.base[k] }, MAP);
  const lg = L.h('g', {}, MAP);
  D.trips.forEach((r, i) => {
    const legs = r.legs.filter((l) => l.xy && l.xy.length > 1);
    const durs = legs.map((l) => Math.max(0.3, l.end - l.start)); const tot = durs.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    legEls.push(legs.map((l, j) => { const pts = l.xy, cum = L.cum(pts); const el = L.h('path', { class: l.kind === 'bus' ? 'bus' : 'walk' }, lg); const o = { el, pts, cum, k0: acc / tot, k1: (acc + durs[j]) / tot, l }; acc += durs[j]; return o; }));
  });
  bldG = L.h('g', {}, MAP);
  const seen = new Set();
  D.events.forEach((e) => { if (!e.xy || seen.has(e.building_id)) return; seen.add(e.building_id); L.h('circle', { cx: e.xy[0], cy: e.xy[1], r: 8, fill: '#F2EEE7', stroke: 'var(--ink)', 'stroke-width': 3 }, bldG);
    const left = ['bbb', 'duderstadt'].includes(e.building_id); L.h('text', { class: 'bl', x: e.xy[0] + (left ? -14 : 14), y: e.xy[1] + (e.building_id === 'ggbl' ? -10 : 6), 'text-anchor': left ? 'end' : 'start' }, bldG, SHORT[e.building_id] || e.building); });
  const [hx, hy] = D.home.xy;
  homeMark = L.h('g', {}, MAP);
  L.h('rect', { x: hx - 11, y: hy - 11, width: 22, height: 22, fill: 'var(--ink)' }, homeMark);
  L.h('text', { class: 'bl', x: hx - 18, y: hy + 6, 'text-anchor': 'end' }, homeMark, 'Home (#1)');
  const pg = L.h('g', {}, MAP);
  D.trips.forEach((r, i) => legEls[i].forEach((o) => { if (o.l.kind !== 'bus') return; const [x, y] = L.at(o.pts, o.cum, 0.5); const g = L.h('g', { class: 'pill' }, pg); const w = 16 + 11 * o.l.route.length; L.h('rect', { x: x - w / 2, y: y - 14, width: w, height: 28, rx: 14 }, g); L.h('text', { x, y: y + 6 }, g, o.l.route); pills.push({ g, i, o }); }));
  headDot = L.h('circle', { r: 7, fill: 'var(--ink)', stroke: '#F2EEE7', 'stroke-width': 3 }, MAP);
  KEY = L.h('div', { class: 'key' }, document.body, `<span><svg width="40" height="10"><line x1="2" y1="5" x2="38" y2="5" class="walk"/></svg> walk</span><span><svg width="40" height="10"><line x1="3" y1="5" x2="37" y2="5" class="bus" style="stroke-width:5"/></svg> bus (route)</span><span>street geometry: Overture/OSM · legs: engine trip paths</span>`);
  // ---------- panel
  PANEL = L.h('div', { class: 'panel' }, document.body);
  L.h('div', { class: 'ph' }, PANEL, `#${D.home.rank} home for this week`);
  L.h('div', { class: 'home' }, PANEL, `${L.short(D.home.id, D.home.name)}<small>${L.usd(D.home.all_in, 0)}/mo all-in · routed on the live UM + AAATA timetables</small>`);
  const ds = L.h('div', { class: 'days' }, PANEL); DAYS.forEach((d) => (dayEls[d] = L.h('span', {}, ds, DAYN[d].slice(0, 3))));
  rowsBox = L.h('div', { class: 'trips' }, PANEL);
  D.trips.forEach((r) => { const row = L.h('div', { class: 'tr' }, rowsBox); const bus = r.mode === 'bus';
    L.h('div', { class: 'tm num' }, row, L.hhmm(r.depart)); L.h('div', { class: 'od' }, row, `${nm(r.from)} → ${nm(r.to)}`);
    L.h('div', { class: 'md' }, row, bus ? `bus ${r.routes.join('→')}` : 'walk'); L.h('div', { class: 'mn num' }, row, `${L.num(r.total, 1)} min`); rowEls.push(row); });
  const C = L.h('div', { class: 'ctr' }, PANEL);
  const cell = (key, lab) => { const c = L.h('div', {}, C); L.h('div', { class: 'k' }, c, lab); ctr[key] = L.h('div', { class: 'v num' }, c); };
  cell('trips', 'trips'); cell('walk', 'walking'); cell('wait', 'waiting'); cell('ivt', 'on the bus'); cell('early', 'forced early'); cell('d2d', 'door to door');
  ctr.gen = L.h('div', { class: 'gen' }, PANEL);
  END = L.h('div', { class: 'end' }, document.body, `${TOT.trips} trips · <b>${L.num(TOT.door_to_door_min / 60, 1)} h</b> door to door · <b>${L.num(TOT.generalized_min / 60, 2)}</b> generalized hours a week → <b>${L.usd(P.vot * TOT.generalized_min / 60 * P.weeks_per_month, 2)}</b>/mo of time at ${L.usd(P.vot, 2)}/h.`);
  L.chrome('one week', `engine day tours, live UM + AAATA GTFS (week of Nov 30 2026) · media/videos/one-week.json`);
};
window.renderFrame = (t) => {
  const outA = L.p(t, 14.4, 0.8);
  L.fade(HEAD, L.p(t, 0.3, 0.8)); HEAD.style.opacity = L.p(t, 0.3, 0.8) * (1 - outA);
  G.style.opacity = L.p(t, 1.2, 0.8) * (1 - outA);
  gEvents.forEach(({ g, k, stu }) => { const t0 = stu ? 2.3 + k * 0.7 : 8.3 + (k - 7) * 0.55; const kk = L.p(t, t0, 0.6); g.style.opacity = kk; g.style.transform = `translateY(${(1 - kk) * 10}px)`; });
  let nt = 0; gTrips.forEach((c, i) => { const kk = L.p(t, 11.6 + i * 0.07, 0.4); c.style.opacity = kk; if (kk > 0.5) nt++; });
  CAP.style.opacity = L.p(t, 8.0, 0.7) * (1 - outA);
  document.getElementById('ctrips').innerHTML = nt ? `<b>${nt}</b> trips (circles: filled = bus)` : '';
  // ---------- phase B
  const inB = L.p(t, 15.0, 0.9);
  MAP.style.opacity = inB; PANEL.style.opacity = inB; KEY.style.opacity = inB;
  PANEL.style.transform = `translateX(${(1 - inB) * 30}px)`;
  let cur = -1; SCHED.forEach((s, i) => { if (t >= s.t0) cur = i; });
  const curDay = cur >= 0 ? D.trips[cur].day : 'M';
  const acc = { trips: 0, walk: 0, wait: 0, ivt: 0, early: 0, d2d: 0, gen: 0 };
  headDot.style.opacity = 0;
  D.trips.forEach((r, i) => {
    const s = SCHED[i], k = L.clamp((t - s.t0) / (s.t1 - s.t0));
    const kk = L.easeInOut(k);
    const faded = r.day !== curDay;
    legEls[i].forEach((o) => { const lk = L.clamp((kk - o.k0) / Math.max(1e-6, o.k1 - o.k0)); o.el.setAttribute('d', lk > 0 ? L.partial(o.pts, o.cum, lk) : ''); o.el.style.opacity = faded ? 0.16 : 1;
      if (i === cur && lk > 0 && lk < 1) { const [x, y] = L.at(o.pts, o.cum, lk); headDot.setAttribute('cx', x); headDot.setAttribute('cy', y); headDot.style.opacity = 1; } });
    if (k > 0) { acc.trips += k >= 1 ? 1 : 0; acc.walk += r.walk * kk; acc.wait += r.wait * kk; acc.ivt += r.ivt * kk; acc.early += r.early * kk; acc.d2d += r.total * kk; acc.gen += r.gen * kk; }
    const row = rowEls[i]; row.style.display = r.day === curDay ? 'grid' : 'none'; row.style.opacity = L.p(t, s.t0 - 0.1, 0.4);
    row.style.fontWeight = i === cur && k < 1 ? 600 : 400;
  });
  pills.forEach(({ g, i, o }) => { const s = SCHED[i]; const k = L.easeInOut(L.clamp((t - s.t0) / (s.t1 - s.t0))); const pk = L.clamp((k - o.k0) / Math.max(1e-6, o.k1 - o.k0) * 3 - 1); g.style.opacity = D.trips[i].day === curDay ? pk : 0.45 * pk; });
  DAYS.forEach((d) => { dayEls[d].className = d === curDay && cur >= 0 ? 'on' : (DAYS.indexOf(d) < DAYS.indexOf(curDay) ? 'done' : ''); });
  ctr.trips.innerHTML = `${acc.trips}<small>/ ${TOT.trips}</small>`;
  ctr.walk.innerHTML = `${L.num(acc.walk, 0)}<small>min</small>`;
  ctr.wait.innerHTML = `${L.num(acc.wait, 0)}<small>min</small>`;
  ctr.ivt.innerHTML = `${L.num(acc.ivt, 0)}<small>min</small>`;
  ctr.early.innerHTML = `${L.num(acc.early, 1)}<small>min</small>`;
  ctr.d2d.innerHTML = `${L.num(acc.d2d / 60, 2)}<small>h</small>`;
  ctr.gen.innerHTML = `generalized (walk & wait ×${L.num(P.m_walk, 3)} in January, transfers +${P.transfer_min} min, early ×${P.m_early}): <b>${L.num(acc.gen, 1)} min</b> = <b>${L.num(acc.gen / 60, 2)} h</b> / week`;
  const e = L.p(t, TEND + 0.9, 0.8);
  rowsBox.style.opacity = 1 - e;
  L.fade(END, e);
};
</script></body></html>
